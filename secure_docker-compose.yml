version: "3.9"

services:
  # ===========================================
  # OpenTelemetry Collector
  # ===========================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: always
    user: "1001:1001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:uid=1001,gid=1001
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
    depends_on:
      - tempo
      - mimir
      - loki

  # ===========================================
  # Grafana Tempo - Traces
  # ===========================================
  tempo:
    image: grafana/tempo:latest
    restart: always
    user: "1001:1001"
    # read_only removido - Tempo precisa escrever no volume
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: ["-config.file=/etc/tempo.yaml"]
    tmpfs:
      - /tmp:uid=1001,gid=1001
    volumes:
      - ./config/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"
      - "9095:9095"

  # ===========================================
  # Grafana Mimir - Métricas
  # ===========================================
  mimir:
    image: grafana/mimir:latest
    restart: always
    user: "1001:1001"
    # read_only removido - Mimir precisa escrever no volume
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: ["-config.file=/etc/mimir.yaml"]
    tmpfs:
      - /tmp:uid=1001,gid=1001
    volumes:
      - ./config/mimir.yaml:/etc/mimir.yaml:ro
      - mimir-data:/data
    ports:
      - "9009:9009"

  # ===========================================
  # Grafana Loki - Logs
  # ===========================================
  loki:
    image: grafana/loki:latest
    restart: always
    user: "1001:1001"
    # read_only removido - Loki precisa escrever no volume
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: ["-config.file=/etc/loki/local-config.yaml"]
    tmpfs:
      - /tmp:uid=1001,gid=1001
    volumes:
      - ./config/loki.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"

  # ===========================================
  # Grafana - Visualização
  # ===========================================
  grafana:
    image: grafana/grafana:latest
    restart: always
    user: "1001:1001"
    # read_only removido - Grafana precisa escrever no volume
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
      - GF_PATHS_DATA=/var/lib/grafana
      - GF_PATHS_LOGS=/var/lib/grafana/logs
      - GF_PATHS_PLUGINS=/var/lib/grafana/plugins
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    tmpfs:
      - /tmp:uid=1001,gid=1001
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - tempo
      - mimir
      - loki

volumes:
  tempo-data:
    external: true
    name: tempo-data
  mimir-data:
    external: true
    name: mimir-data
  loki-data:
    external: true
    name: loki-data
  grafana-data:
    external: true
    name: grafana-data
