services:

  # ===========================================
  # OpenTelemetry Collector
  # ===========================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: always
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "127.0.0.1:4317:4317"   # OTLP gRPC receiver (apenas localhost - Nginx faz proxy)
      - "127.0.0.1:4318:4318"   # OTLP HTTP receiver (apenas localhost - Nginx faz proxy)
      - "8888:8888"   # Prometheus metrics do próprio collector
    depends_on:
      - tempo
      - mimir
      - loki

  # ===========================================
  # Grafana Tempo - Traces
  # ===========================================
  tempo:
    image: grafana/tempo:latest
    restart: always
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./config/tempo.yaml:/etc/tempo.yaml
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"   # Tempo API
      - "9095:9095"   # gRPC (para service graph)

  # ===========================================
  # Grafana Mimir - Métricas
  # ===========================================
  mimir:
    image: grafana/mimir:latest
    restart: always
    command: ["-config.file=/etc/mimir.yaml"]
    volumes:
      - ./config/mimir.yaml:/etc/mimir.yaml
      - mimir-data:/data
    ports:
      - "9009:9009"   # HTTP API

  # ===========================================
  # Grafana Loki - Logs
  # ===========================================
  loki:
    image: grafana/loki:latest
    restart: always
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./config/loki.yaml:/etc/loki/local-config.yaml
      - loki-data:/loki
    ports:
      - "3100:3100"   # HTTP API

  # ===========================================
  # Grafana - Visualização
  # ===========================================
  grafana:
    image: grafana/grafana:latest
    restart: always
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - tempo
      - mimir
      - loki

volumes:
  tempo-data:
  mimir-data:
  loki-data:
  grafana-data:
